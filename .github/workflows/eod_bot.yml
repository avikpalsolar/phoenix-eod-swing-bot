name: Phoenix Nightly EOD Swing & Investing Bot

on:
  workflow_dispatch:
  schedule:
    # সোম থেকে শুক্র রাত ৯:৩০ IST-তে Nightly EOD রিপোর্ট
    - cron: '30 21 * * 1-5'
      timezone: 'Asia/Kolkata'
    # প্রতি শনিবার সকাল ১০:০০ IST-তে Weekly Fundamental আপডেট
    - cron: '0 10 * * 6'
      timezone: 'Asia/Kolkata'

jobs:
  run-eod-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EOD or Weekly Fundamental Pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DOW=$(TZ='Asia/Kolkata' date +%u)
          if [ "$DOW" -eq 6 ]; then
            python eod_swing_bot.py --weekly-fund
          else
            python eod_swing_bot.py
          fi
